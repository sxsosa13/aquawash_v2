<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaWash · Lavadero de autos y motos</title>
<style>
  :root { --azul:#0b5ea8; --turq:#2a9d8f; --fondo:#f2f7fb; --texto:#1c2b39; --borde:#d3dfe9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background:var(--fondo); color:var(--texto); }
  header { background:linear-gradient(135deg,var(--azul),var(--turq)); color:#fff; padding:48px 20px 64px; text-align:center; }
  header h1 { margin:0 0 8px; font-size:2.2rem; }
  header p { margin:0; opacity:.92; font-size:1.1rem; }
  main { max-width:920px; margin:-36px auto 40px; padding:0 16px; display:grid; gap:20px; grid-template-columns:1fr 1.2fr; }
  @media (max-width:780px){ main{ grid-template-columns:1fr; } }
  section { background:#fff; border-radius:14px; padding:22px; box-shadow:0 4px 18px rgba(11,94,168,.10); }
  h2 { margin-top:0; font-size:1.25rem; color:var(--azul); }
  .servicio { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--borde); }
  .servicio:last-child { border-bottom:0; }
  .servicio small { color:#5b6b7a; display:block; }
  .precio { font-weight:700; white-space:nowrap; }
  label { display:block; font-size:.88rem; margin:12px 0 4px; font-weight:600; }
  input, select, textarea { width:100%; padding:10px; border:1px solid var(--borde); border-radius:8px; font:inherit; background:#fff; color:inherit; }
  .tipo { display:flex; gap:10px; }
  .tipo button { flex:1; padding:10px; border:2px solid var(--borde); background:#fff; border-radius:8px; font:inherit; cursor:pointer; }
  .tipo button.activo { border-color:var(--turq); background:#e6f5f3; font-weight:700; }
  .fila { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .enviar { margin-top:18px; width:100%; padding:13px; border:0; border-radius:10px; background:var(--azul); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .enviar:disabled { opacity:.6; cursor:wait; }
  #msg { margin-top:14px; padding:12px; border-radius:8px; display:none; }
  #msg.ok { display:block; background:#e4f6ea; color:#17653a; }
  #msg.error { display:block; background:#fdeaea; color:#9b1c1c; }
  footer { text-align:center; padding:20px; color:#5b6b7a; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>AquaWash</h1>
  <p>Lavadero de autos y motos · Reserve su turno en línea</p>
</header>

<main>
  <section>
    <h2>Nuestros servicios</h2>
    <div id="lista">Cargando servicios…</div>
  </section>

  <section>
    <h2>Reservar turno</h2>
    <form id="form" novalidate>
      <label>Tipo de vehículo</label>
      <div class="tipo">
        <button type="button" data-tipo="AUTO" class="activo">🚗 Auto</button>
        <button type="button" data-tipo="MOTO">🏍️ Moto</button>
      </div>

      <label for="servicio">Servicio</label>
      <select id="servicio"></select>

      <div class="fila">
        <div><label for="fecha">Fecha</label><input type="date" id="fecha"></div>
        <div><label for="hora">Hora disponible</label><select id="hora"></select></div>
      </div>

      <label for="nombre">Nombre completo</label>
      <input id="nombre" autocomplete="name">
      <div class="fila">
        <div><label for="telefono">Teléfono</label><input id="telefono" type="tel" autocomplete="tel"></div>
        <div><label for="placa">Placa</label><input id="placa" maxlength="12"></div>
      </div>
      <label for="email">Email (opcional)</label>
      <input id="email" type="email" autocomplete="email">
      <label for="obs">Observaciones (opcional)</label>
      <textarea id="obs" rows="2"></textarea>

      <button class="enviar" id="enviar" type="submit">Reservar</button>
      <div id="msg" role="status"></div>
    </form>
  </section>
</main>
<footer>AquaWash · Proyecto universitario</footer>

<script>
  let servicios = [], tipo = "AUTO";
  const $ = id => document.getElementById(id);
  const hoy = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $("fecha").min = $("fecha").value = hoy;

  function mostrar(texto, clase) { const m = $("msg"); m.textContent = texto; m.className = clase; }

  async function cargarServicios() {
    try {
      servicios = await (await fetch("/api/servicios")).json();
      $("lista").innerHTML = servicios.map(s =>
        `<div class="servicio"><div>${s.nombre}<small>${s.tipo_vehiculo === "AUTO" ? "Auto" : "Moto"} · ${s.duracion_min} min</small></div>` +
        `<div class="precio">$${Number(s.precio).toFixed(2)}</div></div>`).join("");
      filtrar();
    } catch { $("lista").textContent = "No se pudieron cargar los servicios."; }
  }

  function filtrar() {
    $("servicio").innerHTML = servicios.filter(s => s.tipo_vehiculo === tipo)
      .map(s => `<option value="${s.id}">${s.nombre} — $${Number(s.precio).toFixed(2)}</option>`).join("");
  }

  async function cargarHoras() {
    const f = $("fecha").value;
    if (!f) { $("hora").innerHTML = ""; return; }
    const horas = await (await fetch("/api/horarios?fecha=" + f)).json();
    $("hora").innerHTML = Array.isArray(horas) && horas.length
      ? horas.map(h => `<option>${h}</option>`).join("")
      : "<option value=''>Sin horarios</option>";
  }

  document.querySelectorAll(".tipo button").forEach(b => b.onclick = () => {
    tipo = b.dataset.tipo;
    document.querySelectorAll(".tipo button").forEach(x => x.classList.toggle("activo", x === b));
    filtrar();
  });
  $("fecha").onchange = cargarHoras;

  $("form").onsubmit = async e => {
    e.preventDefault();
    const datos = { tipo, servicio_id: $("servicio").value, fecha: $("fecha").value, hora: $("hora").value,
      nombre: $("nombre").value, telefono: $("telefono").value, placa: $("placa").value,
      email: $("email").value, observacion: $("obs").value };
    $("enviar").disabled = true;
    try {
      const r = await fetch("/api/reservas", { method: "POST", body: JSON.stringify(datos) });
      const j = await r.json();
      if (j.ok) { mostrar(`¡Reserva confirmada! Su número de turno es #${j.cita}.`, "ok"); $("form").reset(); $("fecha").value = hoy; }
      else mostrar(j.error, "error");
    } catch { mostrar("No se pudo conectar con el servidor.", "error"); }
    $("enviar").disabled = false;
    cargarHoras();
  };

  cargarServicios();
  cargarHoras();
</script>
</body>
</html>
